version: '3.8'

services:
  txt-outlier-lookup:
    build: .
    container_name: outlier-backend-python-container
    image: outlier-backend-python-image
    ports:
      - "5000:5000"
    volumes:
      - ./.env:/app/.env:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Longer than gunicorn's 30 s graceful timeout plus the 5 s Missive sender drain, so neither is cut off on deploy.
    stop_grace_period: 40s
    # journald keeps the logs when the container is recreated on a deploy; json-file loses them.
    logging:
      driver: journald
      options:
        tag: outlier-lookup
